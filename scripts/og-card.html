<!DOCTYPE html>
<!-- ============================================================
     Source for og-image.png — the card that shows when someone shares a link.
     Rendered by scripts/make-og.js, which is how it stays editable: the
     previous card was a flat PNG nobody could change a word of.

     The card it replaces was the wordmark alone on navy, off-centre, with a
     third of the frame empty. Handsome, and it told a stranger scrolling a
     subreddit nothing — not what Khayt is, not what it costs, not that it is
     a desktop app. This one keeps the mark and spends the rest of the space
     on the three things that decide whether someone clicks.

     Colours are index.html's own tokens; it is the same page, at 1200×630.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #0a2a50;   /* the icon's own navy, unaltered */
    --navy-2: #071d38;
    --orange: #df6011;   /* the filament */
    --paper:  #ffffff;
    --muted:  #9fb4cf;
    --line:   rgba(255,255,255,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--navy);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    color: var(--paper);
    overflow: hidden;
    position: relative;
  }

  /* A single sweep of light from the top-left, so the flat navy has somewhere
     to go. Nothing decorative sits over the type. */
  .glow {
    position: absolute; inset: -200px auto auto -200px; width: 900px; height: 900px;
    background: radial-gradient(circle at center, rgba(33,109,202,0.42), transparent 62%);
  }
  .grain {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, transparent 55%, var(--navy-2) 100%);
  }

  .card { position: relative; height: 100%; padding: 58px 64px; display: flex; flex-direction: column;
          width: 720px; }

  /* The product, bleeding off the right edge. A share card that shows only
     type is a card that could be about anything; the point of this half is
     that a stranger can see it is a real application before clicking.
     Positioned so the kanban columns are what lands in frame, not the
     window chrome, and cropped rather than shrunk — a whole 1440px dashboard
     scaled into 460px is an unreadable grey rectangle. */
  .shot {
    position: absolute; top: 96px; left: 700px; width: 760px; height: 470px;
    border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: -30px 30px 90px rgba(0,0,0,0.45);
    transform: perspective(1400px) rotateY(-13deg) rotateX(3deg);
    transform-origin: left center;
  }
  .shot img { position: absolute; top: -30px; left: -150px; width: 1240px; display: block; }
  /* Fade the far edge into the navy so the crop does not read as a mistake. */
  .shot::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 40%, rgba(10,42,80,0.55) 100%);
  }

  .top { display: flex; align-items: center; gap: 20px; }
  .top img { width: 76px; height: 76px; border-radius: 19px; display: block; }
  .word {
    font-family: "Archivo", sans-serif; font-weight: 900; font-size: 46px;
    letter-spacing: -0.035em; line-height: 1;
  }
  .word .ar {
    font-family: "IBM Plex Sans Arabic", "Hanken Grotesk", sans-serif;
    font-weight: 700; font-size: 34px; color: var(--muted); margin-inline-start: 14px;
    letter-spacing: 0; vertical-align: 2px;
  }

  h1 {
    font-family: "Archivo", sans-serif; font-weight: 900; font-size: 66px;
    letter-spacing: -0.045em; line-height: 1.02; margin-top: 40px; max-width: 13ch;
  }
  h1 .hl { color: var(--orange); }

  .sub {
    font-size: 23px; line-height: 1.42; color: #cfdcee; margin-top: 20px; max-width: 30ch;
    font-weight: 400;
  }

  .foot { margin-top: auto; margin-bottom: 40px; display: flex; align-items: center; gap: 18px; }
  .chips { display: flex; gap: 9px; flex-wrap: wrap; }
  .chip {
    font-family: "JetBrains Mono", monospace; font-size: 16px; font-weight: 500;
    letter-spacing: .02em; color: #dbe6f4;
    border: 1px solid var(--line); background: rgba(255,255,255,0.06);
    border-radius: 100px; padding: 9px 17px;
  }
  .url {
    position: absolute; bottom: 58px; inset-inline-start: 64px;
    font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 600;
    color: var(--orange); letter-spacing: .01em; white-space: nowrap;
  }

  /* The one claim that is the whole product. Filled rather than outlined so it
     is still the first thing read when the card is a 400px thumbnail in a chat
     window, and on the navy rather than over the screenshot, where it used to
     land on the app's own title bar. */
  .chip.free {
    color: var(--navy); background: var(--orange); border-color: var(--orange);
    font-weight: 600; letter-spacing: .03em;
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="grain"></div>

<div class="card">
  <div class="top">
    <img src="../khayt-icon.png" alt="">
    <div class="word">Khayt <span class="ar">خيط</span></div>
  </div>

  <h1>One desk runs the <span class="hl">whole shop</span>.</h1>
  <p class="sub">The all-in-one production desk for 3D print shops — quoting, queue, invoicing and inventory, entirely offline.</p>

  <div class="foot">
    <div class="chips">
      <span class="chip free">Free · source available</span>
      <span class="chip">macOS · Windows · Linux</span>
    </div>
  </div>
</div>

<div class="shot"><img src="../screenshots/screenshot-queue.png" alt=""></div>
<div class="url">khaytapp.com</div>
</body>
</html>
