name: Deploy to Pages

# Replaces the "legacy" Pages build (deploy from main, through Jekyll), which
# shipped the whole checkout and timed out in "Deploy to GitHub Pages" on 4 of
# 40 runs, each needing a manual re-run.
#
# The site's build output is committed (scripts/*.js run locally before each
# commit), so there is nothing to build here: assemble-site.js copies the files
# the site serves into _site from an explicit list, check-site-refs.js proves
# every local link in them resolves inside _site, and the deploy is retried
# once if it fails. Last, the live site is fetched: the home page and the
# Sparkle feed the Mac app polls (mac/appcast.xml) must both answer 200.
#
# Needs Settings -> Pages -> Source set to "GitHub Actions".
#
# sync-release.yml pushes with GITHUB_TOKEN, which starts no `push` workflow,
# so it dispatches this one explicitly after a push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# One deploy at a time, and never cancel one that has started: the newest
# queued run deploys the newest main anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the connector list and manifests
        run: node .github/scripts/check-connectors.js

      - name: Assemble _site from the served files
        run: node .github/scripts/assemble-site.js _site

      # The signature check: Khayt's own sign-connector.js verify-index, which
      # devices' rules (lib/plugin-update.js checkIndex) back. It needs only the
      # public keys in lib/plugin-manifest.js; the signing key is never here.
      - name: Fetch the connector verifier from the Khayt app
        uses: actions/checkout@v4
        with:
          repository: KhaytApp/Khayt
          ref: main
          path: .khayt-verifier
          sparse-checkout: |
            scripts/sign-connector.js
            lib/plugin-manifest.js
            lib/plugin-update.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify the signed connector list
        run: |
          if grep -q '"_placeholder"' _site/connectors/index.json; then
            echo '::error::connectors/index.json is the unsigned placeholder and must never be served'; exit 1
          else
            node .khayt-verifier/scripts/sign-connector.js verify-index --site _site
          fi

      - name: Every local reference resolves inside _site
        run: node .github/scripts/check-site-refs.js _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .nojekyll is a dotfile, which v4+ leaves out by default.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning::The first deploy failed — retrying once in 60 s"
          sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: The live site answers
        run: |
          fail=0
          for url in https://khaytapp.com/ https://khaytapp.com/mac/appcast.xml; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' -L --retry 5 --retry-delay 10 --retry-all-errors "$url" || true)
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url answered $code, not 200"
              fail=1
            fi
          done
          exit $fail
