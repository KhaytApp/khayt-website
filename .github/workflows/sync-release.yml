name: Sync Khayt release

on:
  # Triggered instantly by the app repo when a release is published
  repository_dispatch:
    types: [khayt-release]

  # Hourly fallback in case the dispatch was missed
  schedule:
    - cron: '0 * * * *'

  # Manual trigger from the Actions tab
  workflow_dispatch:

# Two triggers can fire at once — the app repo dispatches on release while the
# hourly cron is already running — and both rewrite index.html and push. The
# loser dies on `! [rejected] main -> main (fetch first)`. Seen for real on
# 2026-07-30: runs 30517319523 (failed) and 30517321586 (succeeded), seconds
# apart at this repository.
#
# Queue them instead. cancel-in-progress is false on purpose: a sync that is
# already writing the right tag is worth letting finish, and the one behind it
# then finds nothing to commit.
concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2

      - name: Fetch latest Khayt release tag
        id: release
        run: |
          TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/khaytapp/Khayt/releases" \
            | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          # Skip pre-releases explicitly. The download button on khaytapp.com is for
          # the stable channel, and a beta must never become it.
          #
          # This used to test only `draft`, and was saved by the semver check in
          # the next step rejecting a '-beta.N' suffix. That worked, but only by
          # accident, and it hid a real failure: GitHub returns releases newest
          # first, so once a beta is published it is picked EVERY run and the sync
          # skips EVERY time — including for a stable release that shipped just
          # before it and had not synced yet. The site would then sit on an old
          # version indefinitely, with every run reporting success.
          for r in releases:
              if not r['draft'] and not r['prerelease']:
                  print(r['tag_name'])
                  break
          ")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Detected latest release: $TAG"

      - name: Update index.html
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No valid semver release tag found (got: '$TAG') — skipping update"
            exit 0
          fi
          python3 .github/scripts/update_version.py "$TAG"

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "index.html already up to date — nothing to commit"
          else
            git commit -m "chore: auto-sync download links to ${{ steps.release.outputs.tag }}"
            # The concurrency group above stops this workflow racing ITSELF; it
            # says nothing about a commit landing between the checkout and the
            # push. On rejection, REPLAY rather than merge.
            #
            # A rebase is the wrong tool here and was tried first: both sides
            # rewrite index.html, so replaying our commit conflicts on the one
            # file every run touches, and `git pull --rebase` stops dead. Proven
            # locally before this was written.
            #
            # index.html is DERIVED from the latest release tag, so there is
            # nothing to merge — the newest generation simply wins. reset --soft
            # keeps our generated file staged while moving onto origin/main; if it
            # already matches what the other run wrote, there is nothing to commit
            # and we are done.
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
              echo "push rejected — replaying our generated index.html onto origin/main"
              git fetch origin main || exit 1
              git reset --soft origin/main
              if git diff --staged --quiet; then
                echo "the other run already wrote the same links — nothing left to do"
                exit 0
              fi
              git commit -m "chore: auto-sync download links to ${{ steps.release.outputs.tag }}"
              sleep $((attempt * 2))
            done
            echo "::error::could not push after 3 attempts"
            exit 1
          fi
