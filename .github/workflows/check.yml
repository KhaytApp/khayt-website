name: Check

# The site is three hand-written HTML pages and five scripts on GitHub Pages.
# There is no build, so nothing was checking any of it — a syntax error in
# app.js or a stale prerender would ship and only be noticed by a visitor.
#
# These are the checks that can actually fail: everything here has caught a
# real mistake, or guards one that has already happened once.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the default single commit: the sitemap
          # check dates each page by its last commit, and in a shallow clone
          # every file's last commit is the only one there is.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the site checks
        run: node scripts/check-site.js

      - name: Check the connector list and manifests
        run: node .github/scripts/check-connectors.js

      # The signature check: Khayt's own sign-connector.js verify-index, which
      # devices' rules (lib/plugin-update.js checkIndex) back. It needs only the
      # public keys in lib/plugin-manifest.js; the signing key is never here.
      - name: Fetch the connector verifier from the Khayt app
        uses: actions/checkout@v4
        with:
          repository: KhaytApp/Khayt
          ref: main
          path: .khayt-verifier
          sparse-checkout: |
            scripts/sign-connector.js
            lib/plugin-manifest.js
            lib/plugin-update.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify the signed connector list
        run: |
          if grep -q '"_placeholder"' ./connectors/index.json; then
            echo '::warning::connectors/index.json is still the unsigned placeholder; signature not checked'
          else
            node .khayt-verifier/scripts/sign-connector.js verify-index --site .
          fi
